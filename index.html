<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Cobranzas by Esstrada</title>
<style>
:root{--v:#0f766e;--vo:#115e59;--bg:#f1f5f4;--c:#fff;--t:#0f172a;--g:#64748b;--r:#dc2626;--ok:#16a34a;--b:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:90px}
.hide{display:none!important}
header{background:var(--v);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:17px}
header small{opacity:.85;font-size:12px;display:block}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;padding:8px 12px;border-radius:8px;font-size:13px}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.auth{max-width:400px;margin:40px auto;padding:20px}
.auth h2{color:var(--v);margin-bottom:4px}
.auth p{color:var(--g);font-size:14px;margin-bottom:16px}
input,textarea{width:100%;padding:12px;border:1px solid var(--b);border-radius:10px;font-size:16px;margin-bottom:10px;background:#fff;font-family:inherit}
textarea{min-height:170px;resize:vertical}
label{font-size:13px;color:var(--g);display:block;margin:0 0 4px 2px}
.btn{width:100%;padding:13px;border:0;border-radius:10px;font-size:16px;font-weight:600;background:var(--v);color:#fff}
.btn:active{background:var(--vo)}
.btn.sec{background:#e2e8f0;color:var(--t)}
.btn.wa{background:#25d366;color:#06330f}
.link{background:none;border:0;color:var(--v);font-size:14px;margin-top:12px;width:100%;text-decoration:underline}
.msg{font-size:13px;margin-top:8px;color:var(--r);text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--c);border-radius:12px;padding:12px;border:1px solid var(--b)}
.stat span{font-size:12px;color:var(--g);display:block}
.stat b{font-size:20px}
.stat.red b{color:var(--r)}.stat.green b{color:var(--ok)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--b);background:#fff;font-size:14px;font-weight:600;color:var(--g)}
.tabs button.on{background:var(--v);color:#fff;border-color:var(--v)}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.card .top{display:flex;justify-content:space-between;gap:8px}
.card .n{font-weight:700;font-size:16px}
.card .c{font-size:13px;color:var(--g);margin-top:2px}
.card .m{font-weight:700;font-size:17px;white-space:nowrap}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;margin-top:8px}
.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.badge.bad{background:#fee2e2;color:#991b1b}.badge.paid{background:#e0f2fe;color:#075985}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;padding:10px 6px;border:0;border-radius:9px;font-size:14px;font-weight:600}
.acts .w{background:#25d366;color:#06330f;flex:2}
.acts .p{background:#e0f2fe;color:#075985}
.acts .d{background:#fee2e2;color:#991b1b;flex:.6}
.small{font-size:12px;color:var(--g);margin-top:6px}
.empty{text-align:center;color:var(--g);padding:40px 10px;font-size:15px}
.fab{position:fixed;right:16px;bottom:18px;background:var(--v);color:#fff;border:0;border-radius:99px;padding:15px 20px;font-size:16px;font-weight:700;box-shadow:0 6px 18px rgba(15,118,110,.45);z-index:6}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px;max-height:92vh;overflow:auto}
.sheet h3{margin-bottom:12px;color:var(--v)}
.row{display:flex;gap:8px}.row>div{flex:1}
.foot{text-align:center;color:var(--g);font-size:12px;margin-top:20px}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth" class="auth">
  <h2>Cobranzas</h2>
  <p>Cobra a tus clientes por WhatsApp sin incomodarte. Ingresa o crea tu cuenta.</p>
  <label>Nombre de tu negocio (solo al registrarte)</label>
  <input id="a-neg" placeholder="Ej: Bodega San José">
  <label>Correo</label>
  <input id="a-mail" type="email" placeholder="tucorreo@gmail.com" autocomplete="email">
  <label>Contraseña (mínimo 6)</label>
  <input id="a-pass" type="password" autocomplete="current-password">
  <button class="btn" id="a-in">Ingresar</button>
  <button class="link" id="a-up">Crear cuenta nueva</button>
  <div class="msg" id="a-msg"></div>
  <div class="foot">by ESSTRADA Co.</div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <header>
    <div><h1>Cobranzas</h1><small id="h-neg"></small></div>
    <button id="salir">Salir</button>
  </header>
  <div class="wrap">
    <div class="stats">
      <div class="stat red"><span>Por cobrar</span><b id="s-pend">S/ 0</b></div>
      <div class="stat red"><span>Vencido</span><b id="s-venc">S/ 0</b></div>
      <div class="stat green"><span>Recuperado</span><b id="s-rec">S/ 0</b></div>
      <div class="stat"><span>Deudores activos</span><b id="s-n">0</b></div>
    </div>
    <div class="tabs">
      <button id="t-pend" class="on">Pendientes</button>
      <button id="t-pag">Pagados</button>
    </div>
    <div id="lista"></div>
    <div class="foot">Cobranzas by ESSTRADA Co.</div>
  </div>
  <button class="fab" id="nuevo">+ Deudor</button>
</div>

<!-- MODAL NUEVO -->
<div id="m-nuevo" class="modal hide">
  <div class="sheet">
    <h3>Nuevo deudor</h3>
    <label>Nombre</label><input id="n-nom" placeholder="Juan Pérez">
    <label>Celular (9 dígitos)</label><input id="n-cel" type="tel" inputmode="numeric" placeholder="987654321">
    <div class="row">
      <div><label>Monto (S/)</label><input id="n-mon" type="number" inputmode="decimal" placeholder="150"></div>
      <div><label>Vence el</label><input id="n-ven" type="date"></div>
    </div>
    <label>Concepto (opcional)</label><input id="n-con" placeholder="Mercadería, arreglo de moto, consulta...">
    <button class="btn" id="n-ok">Guardar</button>
    <button class="btn sec" id="n-no" style="margin-top:8px">Cancelar</button>
    <div class="msg" id="n-msg"></div>
  </div>
</div>

<!-- MODAL MENSAJE -->
<div id="m-msg" class="modal hide">
  <div class="sheet">
    <h3 id="w-tit">Mensaje de cobro</h3>
    <div class="small" id="w-niv" style="margin:-6px 0 10px"></div>
    <textarea id="w-txt"></textarea>
    <button class="btn wa" id="w-go">Abrir WhatsApp y enviar</button>
    <button class="btn sec" id="w-no" style="margin-top:8px">Cancelar</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where, updateDoc, deleteDoc, doc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ====== PEGA AQUÍ TU CONFIG DE FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyAHmJkr5aMLjq4ztiBIhPR3hbj7Zmm7n-o",
  authDomain: "cobranzas-esstrada.firebaseapp.com",
  projectId: "cobranzas-esstrada",
  storageBucket: "cobranzas-esstrada.firebasestorage.app",
  messagingSenderId: "658958936479",
  appId: "1:658958936479:web:c09fe174361ab38a0a35aa"
};
// =============================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const soles = n => "S/ " + Number(n).toLocaleString("es-PE", {minimumFractionDigits: 0, maximumFractionDigits: 2});

let user = null, negocio = "", datos = [], tab = "pend", actual = null;

/* ---------- fechas ---------- */
function parseLocal(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function hoy(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function diasAtraso(vence){ return Math.round((hoy() - parseLocal(vence)) / 86400000); }
function fechaBonita(s){ return parseLocal(s).toLocaleDateString("es-PE", {day:"numeric", month:"long"}); }

/* ---------- AUTH ---------- */
const authMsg = t => $("a-msg").textContent = t || "";
function errAuth(e){
  const c = e.code || "";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "Correo o contraseña incorrectos.";
  if (c.includes("email-already-in-use")) return "Ese correo ya tiene cuenta. Toca Ingresar.";
  if (c.includes("weak-password")) return "La contraseña debe tener mínimo 6 caracteres.";
  if (c.includes("invalid-email")) return "El correo no es válido.";
  if (c.includes("network")) return "Sin conexión. Revisa tu internet.";
  return "Error: " + (e.message || c);
}

$("a-in").onclick = async () => {
  authMsg("");
  try { await signInWithEmailAndPassword(auth, $("a-mail").value.trim(), $("a-pass").value); }
  catch (e) { authMsg(errAuth(e)); }
};
$("a-up").onclick = async () => {
  authMsg("");
  const neg = $("a-neg").value.trim();
  if (!neg) return authMsg("Escribe el nombre de tu negocio.");
  try {
    const cred = await createUserWithEmailAndPassword(auth, $("a-mail").value.trim(), $("a-pass").value);
    await updateProfile(cred.user, { displayName: neg });
    negocio = neg; $("h-neg").textContent = neg;
  } catch (e) { authMsg(errAuth(e)); }
};
$("salir").onclick = () => signOut(auth);

onAuthStateChanged(auth, u => {
  if (u) {
    user = u;
    negocio = u.displayName || "mi negocio";
    $("h-neg").textContent = negocio;
    $("auth").classList.add("hide");
    $("app").classList.remove("hide");
    cargar();
  } else {
    user = null; datos = [];
    $("app").classList.add("hide");
    $("auth").classList.remove("hide");
  }
});

/* ---------- DATOS ---------- */
async function cargar(){
  try {
    const snap = await getDocs(query(collection(db, "deudores"), where("userId", "==", user.uid)));
    datos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    pintar();
  } catch (e) {
    $("lista").innerHTML = '<div class="empty">Error al cargar. Revisa que Firestore y sus reglas estén publicados.</div>';
  }
}

function pintar(){
  const pend = datos.filter(d => !d.pagado);
  const pag = datos.filter(d => d.pagado);
  const totPend = pend.reduce((a,d) => a + Number(d.monto), 0);
  const totVenc = pend.filter(d => diasAtraso(d.vence) > 0).reduce((a,d) => a + Number(d.monto), 0);
  const totRec = pag.reduce((a,d) => a + Number(d.monto), 0);
  $("s-pend").textContent = soles(totPend);
  $("s-venc").textContent = soles(totVenc);
  $("s-rec").textContent = soles(totRec);
  $("s-n").textContent = pend.length;

  const lista = tab === "pend"
    ? pend.sort((a,b) => diasAtraso(b.vence) - diasAtraso(a.vence))
    : pag.sort((a,b) => (b.pagadoEn || "").localeCompare(a.pagadoEn || ""));
  if (!lista.length) {
    $("lista").innerHTML = '<div class="empty">' + (tab === "pend" ? "No tienes deudores pendientes.<br>Toca <b>+ Deudor</b> para agregar el primero." : "Aún no hay pagos registrados.") + "</div>";
    return;
  }
  $("lista").innerHTML = lista.map(d => {
    const dias = diasAtraso(d.vence);
    let badge;
    if (d.pagado) badge = '<span class="badge paid">Pagó</span>';
    else if (dias > 30) badge = `<span class="badge bad">${dias} días de atraso</span>`;
    else if (dias > 0) badge = `<span class="badge warn">${dias} día${dias>1?"s":""} de atraso</span>`;
    else if (dias === 0) badge = '<span class="badge warn">Vence hoy</span>';
    else badge = `<span class="badge ok">Vence en ${-dias} día${dias<-1?"s":""}</span>`;
    const aviso = d.avisos ? `<div class="small">Avisos enviados: ${d.avisos}</div>` : "";
    const acts = d.pagado ? "" : `
      <div class="acts">
        <button class="w" onclick="cobrar('${esc(d.id)}')">Cobrar por WhatsApp</button>
        <button class="p" onclick="pago('${esc(d.id)}')">Pagó</button>
        <button class="d" onclick="borrar('${esc(d.id)}')">✕</button>
      </div>`;
    return `<div class="card">
      <div class="top"><div><div class="n">${esc(d.nombre)}</div><div class="c">${esc(d.concepto || "Sin concepto")} · vence ${fechaBonita(d.vence)}</div></div>
      <div class="m">${soles(d.monto)}</div></div>${badge}${aviso}${acts}</div>`;
  }).join("");
}

$("t-pend").onclick = () => { tab = "pend"; $("t-pend").classList.add("on"); $("t-pag").classList.remove("on"); pintar(); };
$("t-pag").onclick = () => { tab = "pag"; $("t-pag").classList.add("on"); $("t-pend").classList.remove("on"); pintar(); };

/* ---------- NUEVO ---------- */
$("nuevo").onclick = () => {
  ["n-nom","n-cel","n-mon","n-con"].forEach(i => $(i).value = "");
  const h = hoy();
  $("n-ven").value = h.getFullYear() + "-" + String(h.getMonth()+1).padStart(2,"0") + "-" + String(h.getDate()).padStart(2,"0");
  $("n-msg").textContent = "";
  $("m-nuevo").classList.remove("hide");
};
$("n-no").onclick = () => $("m-nuevo").classList.add("hide");
$("n-ok").onclick = async () => {
  const nombre = $("n-nom").value.trim();
  const celular = $("n-cel").value.replace(/\D/g, "");
  const monto = parseFloat($("n-mon").value);
  const vence = $("n-ven").value;
  if (!nombre || celular.length < 9 || !(monto > 0) || !vence) { $("n-msg").textContent = "Completa nombre, celular (9 dígitos), monto y fecha."; return; }
  try {
    await addDoc(collection(db, "deudores"), {
      userId: user.uid, nombre, celular, monto, vence,
      concepto: $("n-con").value.trim() || "",
      pagado: false, pagadoEn: "", avisos: 0, ultimoAviso: "",
      creado: serverTimestamp()
    });
    $("m-nuevo").classList.add("hide");
    cargar();
  } catch (e) { $("n-msg").textContent = "No se pudo guardar: " + (e.code || e.message); }
};

/* ---------- COBRAR ---------- */
function armarMensaje(d){
  const dias = diasAtraso(d.vence);
  const nom = d.nombre.split(" ")[0];
  const con = d.concepto ? ` por ${d.concepto}` : "";
  const monto = soles(d.monto);
  const fecha = fechaBonita(d.vence);
  if (dias <= 0) return { nivel: "Recordatorio amable (aún no vence)", txt:
`Hola ${nom}, te saluda ${negocio}. 😊 Te recordamos que tu pago de ${monto}${con} vence el ${fecha}. Cualquier consulta, escríbenos. ¡Gracias!` };
  if (dias <= 7) return { nivel: "Aviso amable (1-7 días de atraso)", txt:
`Hola ${nom}, te saluda ${negocio}. Notamos que tu pago de ${monto}${con}, que vencía el ${fecha}, aún está pendiente. Quizá se te pasó. ¿Nos confirmas cuándo podrías cancelarlo? Gracias por tu atención.` };
  if (dias <= 30) return { nivel: "Aviso firme (8-30 días de atraso)", txt:
`Estimado(a) ${nom}, de ${negocio}. Tu deuda de ${monto}${con} tiene ${dias} días de atraso (vencía el ${fecha}). Te pedimos regularizarla esta semana. Si tienes alguna dificultad, comunícate hoy para coordinar. Gracias.` };
  return { nivel: "Último aviso (más de 30 días)", txt:
`Estimado(a) ${nom}, de ${negocio}. ÚLTIMO AVISO: tu deuda de ${monto}${con} tiene ${dias} días de atraso. Necesitamos que la canceles en un plazo máximo de 48 horas o te comuniques con nosotros para acordar un pago. De no hacerlo, evaluaremos otras acciones de cobranza. Esperamos tu respuesta.` };
}

window.cobrar = id => {
  actual = datos.find(x => x.id === id);
  if (!actual) return;
  const m = armarMensaje(actual);
  $("w-tit").textContent = "Cobrar a " + actual.nombre;
  $("w-niv").textContent = m.nivel + " · Puedes editar el texto antes de enviar";
  $("w-txt").value = m.txt;
  $("m-msg").classList.remove("hide");
};
$("w-no").onclick = () => $("m-msg").classList.add("hide");
$("w-go").onclick = async () => {
  if (!actual) return;
  let cel = actual.celular.replace(/\D/g, "");
  if (cel.length === 9) cel = "51" + cel;
  window.open("https://wa.me/" + cel + "?text=" + encodeURIComponent($("w-txt").value), "_blank");
  try { await updateDoc(doc(db, "deudores", actual.id), { ultimoAviso: new Date().toISOString(), avisos: increment(1) }); } catch (e) {}
  $("m-msg").classList.add("hide");
  cargar();
};

/* ---------- ACCIONES ---------- */
window.pago = async id => {
  if (!confirm("¿Confirmas que esta persona ya pagó?")) return;
  await updateDoc(doc(db, "deudores", id), { pagado: true, pagadoEn: new Date().toISOString() });
  cargar();
};
window.borrar = async id => {
  if (!confirm("¿Borrar este deudor? No se puede deshacer.")) return;
  await deleteDoc(doc(db, "deudores", id));
  cargar();
};
</script>
</body>
</html>
